<!DOCTYPE html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | FED General Dealer</title>
    <link rel="canonical" href="https://fed-online.co.za/" />
    <script>
      (function () {
        var path = location.pathname || "/";
        if (/\/index\.html$/i.test(path)) {
          location.replace("/" + location.search + location.hash);
          return;
        }
        if (/\.html$/i.test(path)) {
          location.replace(path.replace(/\.html$/i, "") + location.search + location.hash);
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=login4" />
  </head>
  <body>
    <main class="login-page">
      <div class="login-wrap">
        <div class="login-card">
          <p class="login-eyebrow">FED</p>
          <h1>Page not found</h1>
          <p class="login-lead">That link is not on the FED site.</p>
          <p class="login-help"><a href="/">Back to the home page</a></p>
        </div>
      </div>
    </main>
  </body>
</html>
